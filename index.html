    <!-- 主题预初始化: 在首帧前据 localStorage 设置 <html>.dark, 避免暗色模式闪烁 (FOUC)。
         与 useTheme.ts 共享同一 key 'bazi:theme', 取值 light|dark|system。 -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('bazi:theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
